<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>CoreWell Uganda forms</title></head>
  <body>
    <form name="contact-message" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact-message">
      <input name="bot-field">
      <input name="name">
      <input name="phone">
      <input name="email" type="email">
      <input name="service">
      <textarea name="message"></textarea>
    </form>
    <form name="appointment-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="appointment-request">
      <input name="bot-field">
      <input name="name">
      <input name="phone">
      <input name="email" type="email">
      <input name="service">
      <input name="patient-type">
      <input name="preferred-date" type="date">
      <input name="preferred-time" type="time">
      <textarea name="message"></textarea>
      <input name="consent" type="checkbox" value="yes">
    </form>
  </body>
</html>
